name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `provenance: true` in package.json's publishConfig. npm
      # mints the attestation from this OIDC token, which is why a publish run
      # from a laptop fails no matter how the credentials are set up.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input needed: package.json carries `packageManager`.
      # Without that field this step fails with "No pnpm version is specified",
      # which is what silently broke the docs repo's update workflow.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
